name: Release

# Push a tag equal to manifest.json's "version" (e.g. 0.1.0, no "v") to publish
# a release that BRAT can install (specs/12-ios-platform.feature).
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          test "$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != manifest version $v"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "BrandonGitsidian $GITHUB_REF_NAME" main.js manifest.json styles.css
