name: Release

# Publishes a release that BRAT can install (specs/12-ios-platform.feature).
# Either push a tag equal to manifest.json's "version" (e.g. 0.1.0, no "v"),
# or tap "Run workflow" on GitHub (works from the phone): it tags the manifest version itself.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - name: Work out the version
        id: v
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != manifest version $v"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: gh release create "$V" --target "$GITHUB_SHA" --title "$V" --notes "BrandonGitsidian $V" main.js manifest.json styles.css
